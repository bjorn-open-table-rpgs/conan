---
layout: default
---
<article>
  {{ content }}
</article>
{% assign sesje = site.kronika | sort: "date" | reverse %}
{% if sesje.size > 0 %}
<h2>Ostatnie sesje</h2>
<ul class="kronika">
  {% for s in sesje limit: 3 %}
  <li><a href="{{ s.url | relative_url }}">{{ s.title }}</a><time>{{ s.date | date: "%d.%m.%Y" }}</time></li>
  {% endfor %}
</ul>
{% endif %}
