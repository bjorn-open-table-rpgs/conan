<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      <a class="back" href="{{ site.url }}/">← Kampanie</a>
      <a href="{{ '/' | relative_url }}">Strona główna</a>
      <a href="{{ '/postaci/' | relative_url }}">Postaci</a>
      <a href="{{ '/wiedza-ogolna/' | relative_url }}">Wiedza ogólna</a>
      <a href="{{ '/zasady/' | relative_url }}">Zasady</a>
      <a href="{{ '/kronika/' | relative_url }}">Kronika</a>
      <a href="{{ '/mapa/' | relative_url }}">Mapa</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer class="site-footer">{{ site.title }}</footer>
</body>
</html>
