<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <meta name="theme-color" content="#000000">
  <meta property="og:title" content="{{ site.title }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:image" content="{{ '/assets/baner-kronika.jpg' | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      <a class="back" href="{{ site.url }}/">← Kampanie</a>
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active" aria-current="page"{% endif %}>Strona główna</a>
      <a href="{{ '/postaci.html' | relative_url }}"{% if page.url == '/postaci.html' %} class="active" aria-current="page"{% endif %}>Postaci</a>
      <a href="{{ '/wiedza-ogolna.html' | relative_url }}"{% if page.url == '/wiedza-ogolna.html' %} class="active" aria-current="page"{% endif %}>Wiedza ogólna</a>
      <a href="{{ '/zasady.html' | relative_url }}"{% if page.url == '/zasady.html' %} class="active" aria-current="page"{% endif %}>Zasady</a>
      <a href="{{ '/kronika/' | relative_url }}"{% if page.url contains '/kronika' %} class="active" aria-current="page"{% endif %}>Kronika</a>
      <a href="{{ '/mapa.html' | relative_url }}"{% if page.url == '/mapa.html' %} class="active" aria-current="page"{% endif %}>Mapa</a>
    </nav>
  </header>
  {% if page.hero %}
  <div class="hero">
    <img src="{{ '/assets/baner-kronika-900.jpg' | relative_url }}"
         srcset="{{ '/assets/baner-kronika-900.jpg' | relative_url }} 900w, {{ '/assets/baner-kronika.jpg' | relative_url }} 1584w"
         sizes="(max-width: 600px) 135vw, 100vw"
         width="1584" height="672"
         alt="Wyżyna Wapiennych Kości, Kroniki kampanii, Cień Maga: czarodziej w szacie na skalnej półce wznosi dłoń ku drużynie wojowników po drugiej stronie przepaści pełnej kości i amonitów">
  </div>
  {% endif %}
  <main>
    {{ content }}
  </main>
  <footer class="site-footer">{{ site.title }}</footer>
  <script>
    // 1) Statusy w tabelach (WYKONANE, ZDOBYTE, ???) dostają znacznik do ostylowania.
    // 2) Obraz w treści (np. mapa) otwiera się po dotknięciu w pełnym rozmiarze, gdzie można go powiększyć palcami.
    (function () {
      document.querySelectorAll('main td').forEach(function (td) {
        var t = td.textContent.trim().toUpperCase();
        if (t === 'WYKONANE' || t === 'ZDOBYTE' || t === 'ZDOBYTY' || t === 'GOTOWE') td.classList.add('done');
        else if (t === '???') td.classList.add('unknown');
      });
      document.querySelectorAll('main img').forEach(function (img) {
        if (img.closest('a') || img.closest('.cards') || img.closest('.session-list')) return;
        var a = document.createElement('a');
        a.href = img.currentSrc || img.src;
        a.className = 'zoom';
        a.target = '_blank';
        a.rel = 'noopener';
        img.parentNode.insertBefore(a, img);
        a.appendChild(img);
      });
    })();
  </script>
</body>
</html>
