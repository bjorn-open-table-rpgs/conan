# Ustawienia strony: zmień na początku
title: "CONAN OPEN TABLE"
description: "Kronika, postacie i materiały do kampanii Conan Open Table"
lang: pl

# Ta strona to repozytorium "conan" w organizacji bjorn-open-table-rpgs,
# publikowane pod adresem https://bjorn-open-table-rpgs.github.io/conan/
baseurl: "/conan"
url: "https://bjorn-open-table-rpgs.github.io"

collections:
  sessions:
    output: true
    permalink: /kronika/:name.html

defaults:
  - scope:
      path: ""
      type: "sessions"
    values:
      layout: session

exclude:
  - README.md
  - .obsidian
  - .gitignore
